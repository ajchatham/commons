<svg viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Long section along I-95 from just north of Atwells Ave to just south of Westminster St. North of Atwells and south of Westminster the highway is an open trench. Between them a deck about 1,700 feet long sits at street level over the highway, which keeps running underneath in a tunnel. On the deck: apartment buildings from Atwells Ave to Broadway, then a park to Westminster St, with Broadway and Washington St crossing at street level and emergency stairs from the tunnel up to those two streets.">
