<svg xmlns="http://www.w3.org/2000/svg" aria-label="Cost per acre of highway caps in 2026 dollars" role="img" viewBox="0 0 720 220"><style>text{font:14px &quot;Source Serif 4&quot;,Georgia,serif;fill:#1a2321}.v{font:600 13px &quot;IBM Plex Mono&quot;,Menlo,monospace}</style><text x="0" y="26">Frankie Pace Park, I-579 cap, Pittsburgh (2021)</text><rect width="91.6" height="16" x="330" y="14" fill="#3f6b33" rx="2"/><text x="429.6" y="27" class="v">$13.0M</text><text x="0" y="60">The Cap at Union Station, Columbus (2004)</text><rect width="145" height="16" x="330" y="48" fill="#3f6b33" rx="2"/><text x="483" y="61" class="v">$20.6M</text><text x="0" y="94">Margaret T. Hance Park, Phoenix (1990)</text><rect width="167.1" height="16" x="330" y="82" fill="#3f6b33" rx="2"/><text x="505.1" y="95" class="v">$23.7M</text><text x="0" y="128">Freeway Park, Seattle (1976)</text><rect width="226.6" height="16" x="330" y="116" fill="#3f6b33" rx="2"/><text x="564.6" y="129" class="v">$32.1M</text><text x="0" y="162">Klyde Warren Park, Dallas (2012)</text><rect width="258.5" height="16" x="330" y="150" fill="#3f6b33" rx="2"/><text x="596.5" y="163" class="v">$36.6M</text><text x="0" y="196">Estimates published since 2020, median of 12</text><rect width="300" height="16" x="330" y="184" fill="#a3261b" rx="2"/><text x="638" y="197" class="v">$42.5M</text></svg>