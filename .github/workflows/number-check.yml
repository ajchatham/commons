# Runs on every pull request, including ones from forks. It needs no secrets and can't write to the
# repo: it reads the files, reruns the models and writes its report to the run's summary page.
name: Number check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  number-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check sources, numbers and charts
        run: python3 tools/check.py --against "origin/${GITHUB_BASE_REF:-main}" --charts-out rebuilt
      - name: Keep the redrawn charts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redrawn-charts
          path: rebuilt/
          if-no-files-found: ignore
